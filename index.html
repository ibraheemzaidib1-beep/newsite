<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نظام تسجيل QR</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--red:#E24B4A;--red-light:#FCEBEB;--bg:#F4F3EF;--card:#fff;--border:rgba(0,0,0,0.09);--text:#1a1a1a;--muted:#6b6b6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}
.topbar{background:var(--green);color:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(29,158,117,0.35);}
.topbar h1{font-size:17px;font-weight:800;}
.topbar p{font-size:11px;opacity:.8;margin-top:1px;}
.topbar-icon{width:40px;height:40px;background:rgba(255,255,255,0.18);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.tabs-wrap{background:#fff;border-bottom:1px solid var(--border);}
.tabs{display:flex;max-width:700px;margin:0 auto;padding:0 16px;}
.tab{flex:1;padding:13px 6px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:600;font-family:'Tajawal',sans-serif;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}
.content{max-width:700px;margin:0 auto;padding:18px 16px 70px;}
.panel{display:none;animation:fadeUp .22s ease;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.form-group{margin-bottom:13px;}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
input[type=text],input[type=number]{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:'Tajawal',sans-serif;color:var(--text);background:#fafafa;transition:border-color .15s;}
input:focus{outline:none;border-color:var(--green);background:#fff;}
input[readonly]{background:var(--green-light);color:var(--green-dark);font-weight:700;cursor:default;border-color:#9FE1CB;}
.row{display:flex;gap:10px;}
.row .form-group{flex:1;}
.btn{padding:10px 18px;border-radius:9px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:14px;font-weight:700;font-family:'Tajawal',sans-serif;color:var(--text);transition:all .15s;}
.btn:hover{background:var(--bg);}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--green);color:#fff;border-color:var(--green);}
.btn-green:hover{background:var(--green-dark);}
.btn-danger{border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-light);}
.msg{padding:10px 13px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:12px;display:none;}
.msg.success{background:var(--green-light);color:var(--green-dark);display:block;}
.msg.error{background:var(--red-light);color:#8B2020;display:block;}

/* CAMERA */
.cam-box{border-radius:12px;overflow:hidden;background:#0d0d0d;position:relative;width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.cam-box video{width:100%;height:100%;object-fit:cover;display:none;}
.cam-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;}
.cam-overlay.show{display:flex;}
.qr-frame{width:160px;height:160px;position:relative;}
.cr{position:absolute;width:28px;height:28px;border-color:#1D9E75;border-style:solid;}
.cr-tl{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 7px 0 0;}
.cr-tr{top:0;left:0;border-width:3px 0 0 3px;border-radius:7px 0 0 0;}
.cr-br{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 7px;}
.cr-bl{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 7px 0;}
.scan-line{position:absolute;width:130px;height:2px;background:linear-gradient(90deg,transparent,#1D9E75,transparent);top:50%;left:50%;transform:translateX(-50%);animation:sline 2s ease-in-out infinite;}
@keyframes sline{0%{margin-top:-65px;opacity:.3;}50%{opacity:1;}100%{margin-top:65px;opacity:.3;}}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#aaa;text-align:center;padding:20px;}
.cam-ph .ph-icon{font-size:44px;opacity:.45;}
.cam-ph p{font-size:13px;line-height:1.5;}
.cam-status{text-align:center;font-size:13px;font-weight:700;padding:5px 0 4px;}
.cam-status.ok{color:var(--green);}
.cam-status.idle{color:var(--muted);}

/* RESULT */
.res-card{border-radius:12px;padding:16px;margin-bottom:14px;animation:fadeUp .3s ease;border:1.5px solid;}
.res-card.found{background:var(--green-light);border-color:#5DCAA5;}
.res-card.notfound{background:var(--red-light);border-color:#F09595;}
.res-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.badge-found{background:var(--green);color:#fff;}
.badge-nf{background:var(--red);color:#fff;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid rgba(0,0,0,0.07);}
.info-row:last-child{border-bottom:none;}
.info-label{color:var(--muted);}
.info-val{font-weight:700;}

/* RECORDS */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.counter{font-size:13px;font-weight:600;color:var(--muted);}
.rec-list{display:flex;flex-direction:column;gap:10px;}
.rec-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.rec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.rec-name{font-size:15px;font-weight:800;}
.rec-qr{font-size:11px;font-weight:700;background:var(--green-light);color:var(--green-dark);padding:3px 10px;border-radius:20px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-details{display:flex;flex-wrap:wrap;gap:12px;}
.rec-det{font-size:12px;color:var(--muted);}
.rec-det strong{color:var(--text);font-weight:700;}
.rec-date{font-size:11px;color:var(--muted);margin-top:6px;}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);}
.empty-icon{font-size:46px;display:block;margin-bottom:10px;opacity:.3;}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.confirm-box{background:#fff;border-radius:16px;padding:26px 22px;width:290px;text-align:center;animation:fadeUp .2s ease;}
.confirm-box h3{font-size:16px;font-weight:800;margin-bottom:7px;}
.confirm-box p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.confirm-btns{display:flex;gap:8px;}
.confirm-btns .btn{flex:1;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>نظام تسجيل QR</h1>
    <p>تسجيل وقراءة بيانات الأفراد</p>
  </div>
  <div class="topbar-icon">📋</div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('register')">تسجيل</button>
    <button class="tab" onclick="switchTab('scan')">قراءة QR</button>
    <button class="tab" onclick="switchTab('records')">السجلات</button>
  </div>
</div>

<div class="content">

  <!-- تسجيل -->
  <div id="tab-register" class="panel active">
    <div class="card">
      <div class="card-title">📝 بيانات التسجيل</div>
      <div class="form-group">
        <label>امسح كود QR بالكاميرا</label>
        <div class="cam-box" id="reg-cam">
          <div class="cam-ph" id="reg-ph">
            <div class="ph-icon">📷</div>
            <p>جاري تشغيل الكاميرا...</p>
          </div>
          <video id="reg-video" autoplay playsinline muted></video>
          <div class="cam-overlay" id="reg-ol">
            <div class="qr-frame">
              <div class="cr cr-tl"></div><div class="cr cr-tr"></div>
              <div class="cr cr-br"></div><div class="cr cr-bl"></div>
              <div class="scan-line"></div>
            </div>
          </div>
        </div>
        <div class="cam-status idle" id="reg-status">وجّه الكاميرا نحو كود QR للتسجيل</div>
      </div>
      <div class="form-group">
        <label>كود QR (يُملأ تلقائياً بعد المسح)</label>
        <input type="text" id="qr-val" readonly placeholder="سيُملأ بعد المسح..."/>
      </div>
      <div class="row">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="name-val" placeholder="الاسم"/>
        </div>
        <div class="form-group">
          <label>العمر</label>
          <input type="number" id="age-val" placeholder="العمر" min="1" max="120"/>
        </div>
      </div>
      <div class="form-group">
        <label>العشيرة</label>
        <input type="text" id="tribe-val" placeholder="اسم العشيرة"/>
      </div>
      <div id="reg-msg" class="msg"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-green" onclick="registerEntry()" style="flex:2;font-size:15px;padding:13px;">حفظ التسجيل</button>
        <button class="btn btn-danger" onclick="showReset()">بداية جديدة</button>
      </div>
    </div>
  </div>

  <!-- قراءة -->
  <div id="tab-scan" class="panel">
    <div class="card">
      <div class="card-title">📷 قراءة كود QR</div>
      <div class="cam-box" id="scan-cam">
        <div class="cam-ph" id="scan-ph">
          <div class="ph-icon">📷</div>
          <p>جاري تشغيل الكاميرا...</p>
        </div>
        <video id="scan-video" autoplay playsinline muted></video>
        <div class="cam-overlay" id="scan-ol">
          <div class="qr-frame">
            <div class="cr cr-tl"></div><div class="cr cr-tr"></div>
            <div class="cr cr-br"></div><div class="cr cr-bl"></div>
            <div class="scan-line"></div>
          </div>
        </div>
      </div>
      <div class="cam-status idle" id="scan-status">وجّه الكاميرا نحو كود QR</div>
    </div>
    <div id="scan-result"></div>
  </div>

  <!-- السجلات -->
  <div id="tab-records" class="panel">
    <div class="top-bar">
      <div class="counter" id="rec-counter">إجمالي السجلات: 0</div>
      <button class="btn btn-danger" onclick="showReset()">بداية جديدة</button>
    </div>
    <div id="rec-list" class="rec-list">
      <div class="empty"><span class="empty-icon">📋</span>لا توجد سجلات بعد</div>
    </div>
  </div>

</div>

<div class="overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3>⚠️ تأكيد المسح</h3>
    <p>هل أنت متأكد من مسح جميع التسجيلات؟<br/>لا يمكن التراجع.</p>
    <div class="confirm-btns">
      <button class="btn btn-danger" onclick="resetAll()">نعم، امسح</button>
      <button class="btn" onclick="hideReset()">إلغاء</button>
    </div>
  </div>
</div>

<canvas id="cvs" style="display:none;"></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
let db=[];
try{db=JSON.parse(localStorage.getItem('qrsys_v4')||'[]');}catch(e){}
function saveDB(){try{localStorage.setItem('qrsys_v4',JSON.stringify(db));}catch(e){}}

// camera state
let rs=null,rsOn=false,rsF=null,rsLast='',rsLT=0;
let ss=null,ssOn=false,ssF=null,ssLast='',ssLT=0;

function switchTab(t){
  ['register','scan','records'].forEach((n,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',n===t);
    document.getElementById('tab-'+n).classList.toggle('active',n===t);
  });
  if(t==='register'){startRegCam();stopScanCam();}
  else if(t==='scan'){stopRegCam();startScanCam();}
  else{stopRegCam();stopScanCam();renderRecords();}
}

async function startCam(videoId,phId,olId,onSuccess){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    const v=document.getElementById(videoId);
    v.srcObject=stream; await v.play();
    document.getElementById(phId).style.display='none';
    v.style.display='block';
    document.getElementById(olId).classList.add('show');
    onSuccess(stream);
  }catch(e){
    document.querySelector('#'+phId+' p').textContent='تعذر الوصول للكاميرا — تأكد من منح الإذن';
  }
}
function stopCam(stream,videoId,phId,olId){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const v=document.getElementById(videoId);
  v.srcObject=null;v.style.display='none';
  document.getElementById(phId).style.display='flex';
  document.getElementById(olId).classList.remove('show');
}

// REG CAM
function startRegCam(){
  if(rs)return;
  startCam('reg-video','reg-ph','reg-ol',(stream)=>{rs=stream;rsOn=true;rsLast='';regLoop();});
}
function stopRegCam(){rsOn=false;if(rsF)cancelAnimationFrame(rsF);stopCam(rs,'reg-video','reg-ph','reg-ol');rs=null;}
function regLoop(){
  if(!rsOn)return;
  const v=document.getElementById('reg-video'),c=document.getElementById('cvs');
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    c.width=v.videoWidth;c.height=v.videoHeight;
    const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    const code=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(code){
      const now=Date.now();
      if(code.data!==rsLast||now-rsLT>6000){
        rsLast=code.data;rsLT=now;
        document.getElementById('qr-val').value=code.data;
        document.getElementById('reg-status').textContent='✓ تم مسح الكود: '+code.data;
        document.getElementById('reg-status').className='cam-status ok';
      }
    }
  }
  rsF=requestAnimationFrame(regLoop);
}

// SCAN CAM
function startScanCam(){
  if(ss)return;
  startCam('scan-video','scan-ph','scan-ol',(stream)=>{ss=stream;ssOn=true;ssLast='';scanLoop();});
}
function stopScanCam(){ssOn=false;if(ssF)cancelAnimationFrame(ssF);stopCam(ss,'scan-video','scan-ph','scan-ol');ss=null;}
function scanLoop(){
  if(!ssOn)return;
  const v=document.getElementById('scan-video'),c=document.getElementById('cvs');
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    c.width=v.videoWidth;c.height=v.videoHeight;
    const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    const code=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(code){
      const now=Date.now();
      if(code.data!==ssLast||now-ssLT>5000){
        ssLast=code.data;ssLT=now;
        lookupQR(code.data);
      }
    }
  }
  ssF=requestAnimationFrame(scanLoop);
}

// LOOKUP
function lookupQR(code){
  const entry=db.find(x=>x.qr===code);
  const now=new Date().toLocaleString('ar-IQ');
  const st=document.getElementById('scan-status');
  let html='';
  if(entry){
    st.textContent='✓ تمت القراءة — الشخص مسجل';st.className='cam-status ok';
    html=`<div class="res-card found">
      <div class="res-title">✅ معلومات الشخص <span class="badge badge-found">مسجل</span></div>
      <div class="info-row"><span class="info-label">كود QR</span><span class="info-val">${entry.qr}</span></div>
      <div class="info-row"><span class="info-label">الاسم</span><span class="info-val">${entry.name}</span></div>
      <div class="info-row"><span class="info-label">العشيرة</span><span class="info-val">${entry.tribe}</span></div>
      <div class="info-row"><span class="info-label">العمر</span><span class="info-val">${entry.age} سنة</span></div>
      <div class="info-row"><span class="info-label">تاريخ التسجيل</span><span class="info-val">${entry.regDate}</span></div>
      <div class="info-row"><span class="info-label">وقت القراءة</span><span class="info-val">${now}</span></div>
    </div>`;
  } else {
    st.textContent='⚠ الكود غير مسجل';st.className='cam-status idle';
    html=`<div class="res-card notfound">
      <div class="res-title">⚠️ غير مسجل <span class="badge badge-nf">غير موجود</span></div>
      <div class="info-row"><span class="info-label">كود QR</span><span class="info-val">${code}</span></div>
      <p style="font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6;">هذا الكود غير موجود في النظام. يمكنك تسجيله من تبويب التسجيل.</p>
    </div>`;
  }
  document.getElementById('scan-result').innerHTML=html;
  document.getElementById('scan-result').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// REGISTER
function registerEntry(){
  const qr=document.getElementById('qr-val').value.trim();
  const name=document.getElementById('name-val').value.trim();
  const age=document.getElementById('age-val').value.trim();
  const tribe=document.getElementById('tribe-val').value.trim();
  if(!qr){showMsg('reg-msg','امسح كود QR أولاً بالكاميرا','error');return;}
  if(!name||!age||!tribe){showMsg('reg-msg','يرجى ملء جميع الحقول','error');return;}
  if(db.find(x=>x.qr===qr)){showMsg('reg-msg','هذا الكود مسجل مسبقاً','error');return;}
  db.push({qr,name,age:parseInt(age),tribe,regDate:new Date().toLocaleString('ar-IQ')});
  saveDB();
  showMsg('reg-msg','✓ تم التسجيل بنجاح','success');
  document.getElementById('qr-val').value='';
  document.getElementById('name-val').value='';
  document.getElementById('age-val').value='';
  document.getElementById('tribe-val').value='';
  document.getElementById('reg-status').textContent='وجّه الكاميرا نحو كود QR للتسجيل';
  document.getElementById('reg-status').className='cam-status idle';
  rsLast='';
}

// RECORDS
function renderRecords(){
  document.getElementById('rec-counter').textContent='إجمالي السجلات: '+db.length;
  const list=document.getElementById('rec-list');
  if(!db.length){list.innerHTML='<div class="empty"><span class="empty-icon">📋</span>لا توجد سجلات بعد</div>';return;}
  list.innerHTML=db.slice().reverse().map(r=>`
    <div class="rec-item">
      <div class="rec-head">
        <span class="rec-name">${r.name}</span>
        <span class="rec-qr" title="${r.qr}">${r.qr}</span>
      </div>
      <div class="rec-details">
        <div class="rec-det">العشيرة: <strong>${r.tribe}</strong></div>
        <div class="rec-det">العمر: <strong>${r.age} سنة</strong></div>
      </div>
      <div class="rec-date">📅 ${r.regDate}</div>
    </div>
  `).join('');
}

function showMsg(id,txt,type){
  const el=document.getElementById(id);
  el.textContent=txt;el.className='msg '+type;
  setTimeout(()=>{el.className='msg';},3500);
}
function showReset(){document.getElementById('confirm-overlay').classList.add('show');}
function hideReset(){document.getElementById('confirm-overlay').classList.remove('show');}
function resetAll(){
  db=[];saveDB();hideReset();
  stopRegCam();stopScanCam();
  document.getElementById('scan-result').innerHTML='';
  ['qr-val','name-val','age-val','tribe-val'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('reg-status').textContent='وجّه الكاميرا نحو كود QR للتسجيل';
  document.getElementById('reg-status').className='cam-status idle';
  rsLast='';ssLast='';
  renderRecords();
  switchTab('register');
}

window.addEventListener('load',()=>switchTab('register'));
</script>
</body>
</html>
