<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>نظام المطعم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #0d0b08;
  --bg2: #161210;
  --bg3: #1e1912;
  --bg4: #261f14;
  --surface: #2e2618;
  --border: #3d3220;
  --border2: #4e4128;
  --gold: #d4a843;
  --gold2: #f0c96a;
  --gold-dim: rgba(212,168,67,0.15);
  --text: #f5ead8;
  --text2: #c4a97a;
  --text3: #7a6245;
  --red: #d95f3b;
  --green: #4a9e5c;
  --green2: #62c477;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Cairo', sans-serif;
  color: var(--text);
  touch-action: manipulation;
}

/* ===================== SCREENS ===================== */
.screen { display:none; height:100vh; flex-direction:column; }
.screen.active { display:flex; }

/* ===================== SPLASH / SETTINGS SCREEN ===================== */
#screen-settings {
  background: radial-gradient(ellipse at 30% 20%, #2a1d06 0%, transparent 55%),
              radial-gradient(ellipse at 70% 80%, #1a1008 0%, transparent 55%),
              var(--bg);
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.settings-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 28px;
  padding: 48px 44px;
  width: 100%;
  max-width: 520px;
  box-shadow: var(--shadow), 0 0 80px rgba(212,168,67,0.08);
}

.settings-logo {
  text-align: center;
  margin-bottom: 36px;
}

.settings-logo .icon {
  font-size: 56px;
  display: block;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 12px rgba(212,168,67,0.3));
}

.settings-logo h1 {
  font-size: 28px;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 1px;
}

.settings-logo p {
  font-size: 14px;
  color: var(--text3);
  margin-top: 4px;
}

.field-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.big-input {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 18px;
  font-weight: 700;
  outline: none;
  text-align: right;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 24px;
  -webkit-appearance: none;
}

.big-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,168,67,0.12);
}

.big-input::placeholder { color: var(--text3); font-weight: 400; }

.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  padding: 18px;
  font-family: 'Cairo', sans-serif;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 0.5px;
}

.btn-primary:active { transform: scale(0.97); }

.btn-primary:hover {
  box-shadow: 0 8px 24px rgba(212,168,67,0.4);
}

/* ===================== MAIN APP ===================== */
#screen-app {
  display: none;
}

#screen-app.active {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr 360px;
  height: 100vh;
  overflow: hidden;
}

/* TOP BAR */
.topbar {
  grid-column: 1 / -1;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 68px;
  gap: 12px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}

.topbar-logo {
  font-size: 26px;
  margin-left: 4px;
}

.topbar-name {
  font-size: 20px;
  font-weight: 900;
  color: var(--gold);
  flex: 1;
}

.topbar-time {
  font-size: 13px;
  color: var(--text3);
  font-weight: 600;
}

.topbar-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  color: var(--text2);
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.topbar-btn:active { background: var(--surface); }
.topbar-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

/* ===================== LEFT: MENU PANEL ===================== */
.menu-panel {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Category bar */
.cat-bar {
  display: flex;
  gap: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
  scrollbar-width: none;
}

.cat-bar::-webkit-scrollbar { display:none; }

.cat-pill {
  flex-shrink: 0;
  padding: 8px 20px;
  border-radius: 30px;
  border: 1.5px solid var(--border2);
  font-size: 14px;
  font-weight: 700;
  color: var(--text3);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  background: var(--bg3);
}

.cat-pill.active {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--bg);
}

.cat-pill:active { transform: scale(0.95); }

/* Dishes grid */
.dishes-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.dishes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.dish-card {
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}

.dish-card:active {
  transform: scale(0.94);
  border-color: var(--gold);
}

.dish-img-wrap {
  width: 100%;
  height: 120px;
  overflow: hidden;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
}

.dish-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}

.dish-card:active .dish-img-wrap img { transform: scale(1.05); }

.dish-body {
  padding: 12px;
}

.dish-cat-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  background: var(--bg3);
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.dish-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}

.dish-price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dish-price {
  font-size: 16px;
  font-weight: 900;
  color: var(--gold);
}

.add-btn-icon {
  width: 30px; height: 30px;
  background: var(--gold);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  font-weight: 900;
  color: var(--bg);
  line-height: 1;
}

/* Empty */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.empty-state .ei { font-size: 56px; margin-bottom: 14px; opacity: 0.35; }
.empty-state p { font-size: 15px; }
.empty-state span { color: var(--gold); }

/* ===================== RIGHT: ORDER PANEL ===================== */
.order-panel {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.order-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.order-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.order-title {
  font-size: 17px;
  font-weight: 900;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 8px;
}

.order-count {
  background: var(--gold);
  color: var(--bg);
  border-radius: 30px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 900;
}

.clear-btn {
  background: rgba(217,95,59,0.12);
  border: 1px solid rgba(217,95,59,0.25);
  border-radius: 8px;
  padding: 6px 12px;
  color: var(--red);
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.clear-btn:active { background: rgba(217,95,59,0.25); }

.customer-field {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  outline: none;
  text-align: right;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.customer-field:focus { border-color: var(--gold); }
.customer-field::placeholder { color: var(--text3); }

/* Order items list */
.order-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.order-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  padding: 30px;
  text-align: center;
}

.order-empty-icon { font-size: 52px; opacity: 0.3; margin-bottom: 12px; }

.order-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid var(--border);
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

.oi-thumb {
  width: 46px; height: 46px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.oi-thumb img { width: 100%; height: 100%; object-fit: cover; }

.oi-info { flex: 1; min-width: 0; }
.oi-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oi-subtotal { font-size: 12px; color: var(--gold); font-weight: 700; margin-top: 2px; }

.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border2);
}

.qb {
  width: 36px; height: 36px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
  font-family: monospace;
}

.qb:active { background: var(--gold); color: var(--bg); }
.qn { font-size: 14px; font-weight: 900; min-width: 28px; text-align: center; }

/* Order footer */
.order-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg2);
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 13px;
}

.total-row .lbl { color: var(--text3); }
.total-row .val { font-weight: 700; color: var(--text2); }

.tax-row-ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.tax-row-ctrl .lbl { font-size: 13px; color: var(--text3); flex: 1; }

.tax-inp {
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  padding: 5px 10px;
  color: var(--gold);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 900;
  width: 64px;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
}

.grand-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0 12px;
  border-top: 1px solid var(--border2);
  margin-top: 6px;
}

.grand-lbl { font-size: 15px; font-weight: 700; color: var(--text); }
.grand-val { font-size: 24px; font-weight: 900; color: var(--gold); }

.btn-invoice {
  width: 100%;
  background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 16px;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
  letter-spacing: 0.3px;
}

.btn-invoice:active {
  transform: scale(0.97);
  box-shadow: 0 4px 16px rgba(74,158,92,0.4);
}

/* ===================== MANAGE SCREEN (FULLSCREEN MODAL) ===================== */
#screen-manage {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  display: none;
  flex-direction: column;
}

#screen-manage.active { display: flex; }

.manage-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 68px;
  gap: 14px;
  flex-shrink: 0;
}

.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 10px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--text2);
  flex-shrink: 0;
}

.back-btn:active { background: var(--surface); }

.manage-title {
  font-size: 19px;
  font-weight: 900;
  color: var(--gold);
  flex: 1;
}

.manage-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}

/* Add form card */
.form-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 24px;
  position: sticky;
  top: 0;
}

.form-card h3 {
  font-size: 16px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.field-group { margin-bottom: 14px; }

.field-group label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 6px;
}

.field-inp {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  outline: none;
  text-align: right;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.field-inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,168,67,0.1); }
.field-inp::placeholder { color: var(--text3); }

/* Image upload area */
.img-drop {
  width: 100%;
  height: 150px;
  border: 2px dashed var(--border2);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: var(--bg3);
  transition: border-color 0.2s;
}

.img-drop:active { border-color: var(--gold); }
.img-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.img-drop-icon { font-size: 36px; margin-bottom: 8px; }
.img-drop-text { font-size: 13px; color: var(--text3); text-align: center; }

.img-drop-preview {
  position: absolute;
  inset: 0;
  object-fit: cover;
  display: none;
}

.btn-add-dish {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  padding: 15px;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 4px;
  transition: transform 0.12s;
}

.btn-add-dish:active { transform: scale(0.97); }

/* Dish list in manage */
.dishes-list-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 20px;
}

.dishes-list-card h3 {
  font-size: 16px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.manage-dish-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg3);
  border-radius: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  animation: slideIn 0.2s ease;
}

.mdi-img {
  width: 54px; height: 54px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}

.mdi-img img { width: 100%; height: 100%; object-fit: cover; }

.mdi-info { flex: 1; min-width: 0; }
.mdi-name { font-size: 14px; font-weight: 700; }
.mdi-cat { font-size: 11px; color: var(--text3); margin-top: 1px; }
.mdi-price { font-size: 15px; font-weight: 900; color: var(--gold); margin-top: 3px; }

.del-btn {
  background: rgba(217,95,59,0.12);
  border: 1px solid rgba(217,95,59,0.25);
  border-radius: 10px;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
}

.del-btn:active { background: rgba(217,95,59,0.35); }

/* ===================== INVOICE OVERLAY ===================== */
#invoice-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  padding: 20px;
}

#invoice-overlay.open { opacity: 1; pointer-events: all; }

.invoice-modal {
  background: white;
  border-radius: 20px;
  width: 100%;
  max-width: 440px;
  max-height: 88vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: translateY(20px);
  transition: transform 0.3s;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}

#invoice-overlay.open .invoice-modal { transform: translateY(0); }

.invoice-scroll {
  overflow-y: auto;
  flex: 1;
}

#invoice-content {
  padding: 32px 28px 20px;
  font-family: 'Cairo', sans-serif;
  color: #1a1207;
  direction: rtl;
}

.inv-top {
  text-align: center;
  padding-bottom: 20px;
  border-bottom: 2.5px double #c9a84c;
  margin-bottom: 18px;
}

.inv-rest-name {
  font-family: 'Amiri', serif;
  font-size: 26px;
  font-weight: 700;
  color: #8b6510;
  margin-bottom: 3px;
}

.inv-icon { font-size: 32px; margin-bottom: 6px; display: block; }

.inv-num {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

.inv-meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #888;
  margin-bottom: 12px;
}

.inv-customer-box {
  background: #fef9ee;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  color: #444;
  margin-bottom: 14px;
}

table.inv-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-bottom: 14px;
}

table.inv-tbl th {
  background: #8b6510;
  color: white;
  padding: 8px 10px;
  text-align: right;
  font-weight: 700;
}

table.inv-tbl th:last-child { text-align: left; }
table.inv-tbl td { padding: 8px 10px; border-bottom: 1px solid #f0e0c0; }
table.inv-tbl td:last-child { text-align: left; font-weight: 700; }
table.inv-tbl tr:nth-child(even) td { background: #fdf7ee; }

.inv-totals { border-top: 2px solid #c9a84c; padding-top: 10px; }

.inv-tr {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 3px 0;
  color: #666;
}

.inv-grand-row {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  font-weight: 900;
  color: #8b6510;
  padding-top: 8px;
  border-top: 1px solid #c9a84c;
  margin-top: 6px;
}

.inv-footer {
  text-align: center;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px dashed #c9a84c;
  font-size: 12px;
  color: #bbb;
  line-height: 1.8;
}

.invoice-actions {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid #f0e0c0;
  background: #fafaf8;
  flex-shrink: 0;
}

.inv-btn {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s;
}

.inv-btn:active { transform: scale(0.97); }

.inv-btn-print {
  background: linear-gradient(135deg, #8b6510, #c9a84c);
  color: white;
}

.inv-btn-close {
  background: #f0ede8;
  color: #666;
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--gold);
  color: var(--bg);
  padding: 12px 28px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(212,168,67,0.4);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===================== CLOCK ===================== */
#clock { font-variant-numeric: tabular-nums; }

/* ===================== PRINT ===================== */
@media print {
  body > *:not(#invoice-print-area) { display: none !important; }
  #invoice-print-area {
    display: block !important;
    position: fixed;
    inset: 0;
    background: white;
    z-index: 9999;
    padding: 40px;
  }
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<!-- ======================== SETTINGS SCREEN ======================== -->
<div id="screen-settings" class="screen active">
  <div class="settings-card">
    <div class="settings-logo">
      <span class="icon">🍽️</span>
      <h1>نظام المطعم</h1>
      <p>Restaurant POS · iPad Edition</p>
    </div>

    <div class="field-label">اسم المطعم</div>
    <input type="text" class="big-input" id="restNameInput" placeholder="أدخل اسم مطعمك..." maxlength="40">

    <button class="btn-primary" onclick="startApp()">
      🚀 ابدأ الآن
    </button>
  </div>
</div>

<!-- ======================== MAIN APP SCREEN ======================== -->
<div id="screen-app" class="screen">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">🍽️</div>
    <div class="topbar-name" id="topbarName">المطعم</div>
    <div class="topbar-time" id="clock"></div>
    <button class="topbar-btn active" onclick="setView('pos')" id="btn-pos">📋 الطلبات</button>
    <button class="topbar-btn" onclick="openManage()" id="btn-manage">⚙️ الأطباق</button>
    <button class="topbar-btn" onclick="goSettings()">🏪 الإعدادات</button>
  </div>

  <!-- MENU PANEL (LEFT) -->
  <div class="menu-panel">
    <div class="cat-bar" id="catBar"></div>
    <div class="dishes-scroll">
      <div class="dishes-grid" id="dishesGrid"></div>
    </div>
  </div>

  <!-- ORDER PANEL (RIGHT) -->
  <div class="order-panel">
    <div class="order-header">
      <div class="order-header-row">
        <div class="order-title">
          🧾 الطلب
          <span class="order-count" id="orderCount">0</span>
        </div>
        <button class="clear-btn" onclick="clearOrder()">🗑️ مسح</button>
      </div>
      <input type="text" class="customer-field" id="custName" placeholder="👤 اسم العميل...">
    </div>

    <div class="order-list" id="orderList">
      <div class="order-empty">
        <div class="order-empty-icon">🛒</div>
        <div style="font-size:14px">اضغط على أي طبق لإضافته</div>
      </div>
    </div>

    <div class="order-footer">
      <div class="total-row">
        <span class="lbl">المجموع الفرعي</span>
        <span class="val" id="subtotal">0.00 ر.س</span>
      </div>
      <div class="tax-row-ctrl">
        <span class="lbl">الضريبة %</span>
        <input type="number" class="tax-inp" id="taxRate" value="15" min="0" max="100" oninput="calcTotals()">
      </div>
      <div class="total-row">
        <span class="lbl">قيمة الضريبة</span>
        <span class="val" id="taxAmt">0.00 ر.س</span>
      </div>
      <div class="grand-row">
        <span class="grand-lbl">الإجمالي</span>
        <span class="grand-val" id="grandTotal">0.00 ر.س</span>
      </div>
      <button class="btn-invoice" onclick="openInvoice()">🖨️ إنشاء الفاتورة وطباعتها</button>
    </div>
  </div>
</div>

<!-- ======================== MANAGE SCREEN ======================== -->
<div id="screen-manage" class="screen">
  <div class="manage-header">
    <div class="back-btn" onclick="closeManage()">←</div>
    <div class="manage-title">⚙️ إدارة الأطباق</div>
  </div>

  <div class="manage-body">
    <!-- ADD FORM -->
    <div class="form-card">
      <h3>➕ إضافة طبق جديد</h3>

      <div class="field-group">
        <label>اسم الطبق *</label>
        <input type="text" class="field-inp" id="fName" placeholder="مثال: كبسة دجاج">
      </div>

      <div class="field-group">
        <label>السعر (ر.س) *</label>
        <input type="number" class="field-inp" id="fPrice" placeholder="0.00" min="0" step="0.5">
      </div>

      <div class="field-group">
        <label>التصنيف</label>
        <input type="text" class="field-inp" id="fCat" placeholder="مشاوي، مشروبات، حلويات...">
      </div>

      <div class="field-group">
        <label>الوصف (اختياري)</label>
        <input type="text" class="field-inp" id="fDesc" placeholder="وصف مختصر">
      </div>

      <div class="field-group">
        <label>صورة الطبق</label>
        <div class="img-drop" id="imgDrop">
          <input type="file" id="imgFile" accept="image/*" onchange="handleImg(this)">
          <img class="img-drop-preview" id="imgPrev">
          <div id="imgPlaceholder">
            <div class="img-drop-icon">📷</div>
            <div class="img-drop-text">اضغط لرفع صورة<br><small>PNG · JPG · WebP</small></div>
          </div>
        </div>
      </div>

      <button class="btn-add-dish" onclick="addDish()">✅ إضافة الطبق</button>
    </div>

    <!-- DISHES LIST -->
    <div class="dishes-list-card">
      <h3>📋 الأطباق الحالية <span style="font-size:13px;font-weight:600;color:var(--text3)" id="dishCount"></span></h3>
      <div id="manageDishList"></div>
    </div>
  </div>
</div>

<!-- ======================== INVOICE OVERLAY ======================== -->
<div id="invoice-overlay">
  <div class="invoice-modal">
    <div class="invoice-scroll">
      <div id="invoice-content"></div>
    </div>
    <div class="invoice-actions">
      <button class="inv-btn inv-btn-print" onclick="doPrint()">🖨️ طباعة</button>
      <button class="inv-btn inv-btn-close" onclick="closeInvoice()">✕ إغلاق</button>
    </div>
  </div>
</div>

<!-- PRINT AREA -->
<div id="invoice-print-area" style="display:none"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===================== STATE =====================
let dishes = [];
let order = [];
let restName = '';
let invNum = parseInt(localStorage.getItem('invNum') || '1000');
let currentCat = 'all';
let pendingImg = '';

// Load saved dishes
try { dishes = JSON.parse(localStorage.getItem('rDishes') || '[]'); } catch(e) { dishes = []; }
try { restName = localStorage.getItem('rName') || ''; } catch(e) {}
if (restName) {
  document.getElementById('restNameInput').value = restName;
}

// ===================== CLOCK =====================
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

// ===================== SETTINGS → APP =====================
function startApp() {
  const name = document.getElementById('restNameInput').value.trim();
  if (!name) { toast('⚠️ أدخل اسم المطعم'); return; }
  restName = name;
  localStorage.setItem('rName', restName);
  document.getElementById('topbarName').textContent = restName;
  document.getElementById('screen-settings').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  renderMenu();
  renderCats();
  renderOrder();
}

function goSettings() {
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-settings').classList.add('active');
}

// ===================== MANAGE SCREEN =====================
function openManage() {
  document.getElementById('screen-manage').classList.add('active');
  renderManageList();
}

function closeManage() {
  document.getElementById('screen-manage').classList.remove('active');
  renderMenu();
  renderCats();
}

// ===================== IMAGE =====================
function handleImg(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingImg = e.target.result;
    document.getElementById('imgPrev').src = pendingImg;
    document.getElementById('imgPrev').style.display = 'block';
    document.getElementById('imgPlaceholder').style.display = 'none';
  };
  reader.readAsDataURL(input.files[0]);
}

// ===================== ADD DISH =====================
function addDish() {
  const name = document.getElementById('fName').value.trim();
  const price = parseFloat(document.getElementById('fPrice').value);
  const cat = document.getElementById('fCat').value.trim() || 'عام';
  const desc = document.getElementById('fDesc').value.trim();

  if (!name) { toast('⚠️ أدخل اسم الطبق'); return; }
  if (isNaN(price) || price < 0) { toast('⚠️ أدخل سعراً صحيحاً'); return; }

  dishes.push({ id: Date.now(), name, price, cat, desc, img: pendingImg });
  saveDishes();
  renderManageList();

  // Reset
  document.getElementById('fName').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fCat').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('imgPrev').style.display = 'none';
  document.getElementById('imgPlaceholder').style.display = 'flex';
  document.getElementById('imgFile').value = '';
  pendingImg = '';

  toast(`✅ أُضيف "${name}"`);
}

function deleteDish(id) {
  dishes = dishes.filter(d => d.id !== id);
  order = order.filter(o => o.id !== id);
  saveDishes();
  renderManageList();
  renderOrder();
  toast('🗑️ حُذف الطبق');
}

function saveDishes() {
  try { localStorage.setItem('rDishes', JSON.stringify(dishes)); } catch(e) {}
}

// ===================== RENDER MENU =====================
function renderMenu() {
  const grid = document.getElementById('dishesGrid');
  const filtered = currentCat === 'all' ? dishes : dishes.filter(d => d.cat === currentCat);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="ei">🍽️</div>
      <p>${dishes.length === 0 ? 'لا توجد أطباق بعد<br>اضغط <span>⚙️ الأطباق</span> لإضافة وجبات' : 'لا توجد أطباق في هذا التصنيف'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="dish-card" onclick="addToOrder(${d.id})">
      <div class="dish-img-wrap">
        ${d.img ? `<img src="${d.img}" alt="${d.name}" loading="lazy">` : '🍽️'}
      </div>
      <div class="dish-body">
        <div class="dish-cat-tag">${d.cat}</div>
        <div class="dish-title">${d.name}</div>
        <div class="dish-price-row">
          <div class="dish-price">${d.price.toFixed(2)} ر.س</div>
          <div class="add-btn-icon">+</div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderCats() {
  const cats = ['all', ...new Set(dishes.map(d => d.cat))];
  document.getElementById('catBar').innerHTML = cats.map(c => `
    <div class="cat-pill ${currentCat === c ? 'active' : ''}"
      onclick="setCat('${c}', this)">
      ${c === 'all' ? '🍽️ الكل' : c}
    </div>
  `).join('');
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderMenu();
}

// ===================== MANAGE LIST =====================
function renderManageList() {
  const list = document.getElementById('manageDishList');
  document.getElementById('dishCount').textContent = `(${dishes.length} طبق)`;

  if (dishes.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding:40px"><div class="ei">🍽️</div><p>لا توجد أطباق</p></div>`;
    return;
  }

  list.innerHTML = dishes.map(d => `
    <div class="manage-dish-item">
      <div class="mdi-img">
        ${d.img ? `<img src="${d.img}" loading="lazy">` : '🍽️'}
      </div>
      <div class="mdi-info">
        <div class="mdi-name">${d.name}</div>
        <div class="mdi-cat">${d.cat}${d.desc ? ' · ' + d.desc : ''}</div>
        <div class="mdi-price">${d.price.toFixed(2)} ر.س</div>
      </div>
      <div class="del-btn" onclick="deleteDish(${d.id})">🗑️</div>
    </div>
  `).join('');
}

// ===================== ORDER =====================
function addToOrder(id) {
  const dish = dishes.find(d => d.id === id);
  if (!dish) return;
  const existing = order.find(o => o.id === id);
  if (existing) { existing.qty++; }
  else { order.push({ id, qty: 1 }); }
  renderOrder();
  toast(`🛒 أُضيف ${dish.name}`);
}

function changeQty(id, delta) {
  const item = order.find(o => o.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) order = order.filter(o => o.id !== id);
  renderOrder();
}

function clearOrder() {
  if (!order.length) return;
  order = [];
  renderOrder();
  toast('🗑️ تم مسح الطلب');
}

function renderOrder() {
  const list = document.getElementById('orderList');
  const count = order.reduce((s, o) => s + o.qty, 0);
  document.getElementById('orderCount').textContent = count;

  if (!order.length) {
    list.innerHTML = `<div class="order-empty">
      <div class="order-empty-icon">🛒</div>
      <div style="font-size:14px">اضغط على أي طبق لإضافته</div>
    </div>`;
    calcTotals();
    return;
  }

  list.innerHTML = order.map(item => {
    const d = dishes.find(x => x.id === item.id);
    if (!d) return '';
    return `
      <div class="order-item">
        <div class="oi-thumb">
          ${d.img ? `<img src="${d.img}" loading="lazy">` : '🍽️'}
        </div>
        <div class="oi-info">
          <div class="oi-name">${d.name}</div>
          <div class="oi-subtotal">${(d.price * item.qty).toFixed(2)} ر.س</div>
        </div>
        <div class="qty-ctrl">
          <button class="qb" onclick="changeQty(${item.id}, -1)">−</button>
          <span class="qn">${item.qty}</span>
          <button class="qb" onclick="changeQty(${item.id}, +1)">+</button>
        </div>
      </div>
    `;
  }).join('');

  calcTotals();
}

function calcTotals() {
  const sub = order.reduce((s, o) => {
    const d = dishes.find(x => x.id === o.id);
    return s + (d ? d.price * o.qty : 0);
  }, 0);
  const tax = sub * (parseFloat(document.getElementById('taxRate').value) || 0) / 100;
  const grand = sub + tax;
  document.getElementById('subtotal').textContent = sub.toFixed(2) + ' ر.س';
  document.getElementById('taxAmt').textContent = tax.toFixed(2) + ' ر.س';
  document.getElementById('grandTotal').textContent = grand.toFixed(2) + ' ر.س';
}

// ===================== INVOICE =====================
function openInvoice() {
  if (!order.length) { toast('⚠️ الطلب فارغ'); return; }

  invNum++;
  localStorage.setItem('invNum', invNum);

  const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
  const cust = document.getElementById('custName').value.trim();
  const now = new Date();
  const dateStr = now.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

  const sub = order.reduce((s, o) => {
    const d = dishes.find(x => x.id === o.id);
    return s + (d ? d.price * o.qty : 0);
  }, 0);
  const tax = sub * taxRate / 100;
  const grand = sub + tax;

  const rows = order.map(item => {
    const d = dishes.find(x => x.id === item.id);
    if (!d) return '';
    return `<tr>
      <td>${d.name}</td>
      <td style="text-align:center">${item.qty}</td>
      <td style="text-align:center">${d.price.toFixed(2)}</td>
      <td>${(d.price * item.qty).toFixed(2)}</td>
    </tr>`;
  }).join('');

  const html = `
    <div class="inv-top">
      <span class="inv-icon">🍽️</span>
      <div class="inv-rest-name">${restName}</div>
      <div class="inv-num">فاتورة رقم #${invNum}</div>
    </div>
    <div class="inv-meta-row">
      <span>📅 ${dateStr}</span>
      <span>⏰ ${timeStr}</span>
    </div>
    ${cust ? `<div class="inv-customer-box">👤 العميل: <strong>${cust}</strong></div>` : ''}
    <table class="inv-tbl">
      <thead><tr>
        <th>الصنف</th>
        <th style="text-align:center">الكمية</th>
        <th style="text-align:center">السعر</th>
        <th style="text-align:left">الإجمالي</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="inv-totals">
      <div class="inv-tr"><span>المجموع الفرعي:</span><span>${sub.toFixed(2)} ر.س</span></div>
      ${taxRate > 0 ? `<div class="inv-tr"><span>ضريبة (${taxRate}%):</span><span>${tax.toFixed(2)} ر.س</span></div>` : ''}
      <div class="inv-grand-row"><span>الإجمالي:</span><span>${grand.toFixed(2)} ر.س</span></div>
    </div>
    <div class="inv-footer">شكراً لزيارتكم 🌟<br>${restName}<br>نتمنى لكم وجبة شهية</div>
  `;

  document.getElementById('invoice-content').innerHTML = html;
  document.getElementById('invoice-print-area').innerHTML = `<div style="font-family:'Cairo',sans-serif;direction:rtl;padding:40px;background:white;color:#1a1207">${html}</div>`;
  document.getElementById('invoice-overlay').classList.add('open');
}

function closeInvoice() {
  document.getElementById('invoice-overlay').classList.remove('open');
}

function doPrint() {
  window.print();
}

// Close on backdrop
document.getElementById('invoice-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeInvoice();
});

// ===================== TOAST =====================
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ===================== INIT =====================
if (restName) {
  document.getElementById('topbarName').textContent = restName;
  document.getElementById('screen-settings').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  renderMenu();
  renderCats();
  renderOrder();
}
</script>
</body>
</html>
